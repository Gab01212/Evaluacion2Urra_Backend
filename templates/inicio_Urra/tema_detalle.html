{% extends 'base.html' %}
{% load static %}

{% block title %}{{ tema.nombre }} - Detalles{% endblock %}

{% block content %}
<div class="row align-items-center mb-5">
    <div class="col-lg-12 text-center">
        <h1 class="display-5 fw-bold text-primary mb-3">{{ tema.nombre }}</h1>
        <p class="lead text-muted">{{ tema.descripcion }}</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow border-0 rounded-4 overflow-hidden">
            <div id="carouselTema{{ tema.id }}" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-indicators">
                    {% for img in tema.imagenes %}
                        <button type="button" data-bs-target="#carouselTema{{ tema.id }}" data-bs-slide-to="{{ forloop.counter0 }}" {% if forloop.first %}class="active" aria-current="true"{% endif %} aria-label="Slide {{ forloop.counter }}"></button>
                    {% endfor %}
                </div>
                <div class="carousel-inner">
                    {% for img in tema.imagenes %}
                        <div class="carousel-item {% if forloop.first %}active{% endif %} bg-light">
                            <img src="{% static img %}" class="d-block w-100" alt="Imagen de {{ tema.nombre }}" style="height: 500px; object-fit: contain;">
                        </div>
                    {% endfor %}
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselTema{{ tema.id }}" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselTema{{ tema.id }}" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Siguiente</span>
                </button>
            </div>
            <div class="card-footer bg-white border-0 text-center py-4">
                 <a href="{% url 'inicio:inicio' %}" class="btn btn-outline-secondary rounded-pill px-4">Volver al Inicio</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
