{% extends 'base.html' %}
{% load static %}

{% block title %}Inicio - Temas{% endblock %}

{% block content %}
<div class="text-center mb-5">
    <h1 class="display-4 fw-bold text-primary mb-3">Evaluacion 2 Backend</h1>
    <p class="lead text-muted">Gabriel Urra</p>
</div>

<div class="row justify-content-center g-4">
    {% for tema in temas %}
    <div class="col-md-6 col-lg-5">
        <div class="card h-100 shadow-sm border-0 transition-hover">
            <div class="card-img-top bg-light d-flex align-items-center justify-content-center" style="height: 250px; font-size: 6rem;">
                {{ tema.portada_emoji }}
            </div>
            <div class="card-body d-flex flex-column">
                <h5 class="card-title fw-bold">{{ tema.nombre }}</h5>
                <a href="{% url 'inicio:tema_detalle' tema.id %}" class="btn btn-outline-primary mt-auto w-100 rounded-pill">Ver Detalles</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<style>
    .transition-hover {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .transition-hover:hover {
        transform: translateY(-5px);
        box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
    }
</style>
{% endblock %}
